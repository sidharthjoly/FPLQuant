name: Scheduled injury history ingest

on:
  schedule:
    # Weekly (Sundays, 04:00 UTC) — injury history changes slowly, and scraping
    # the full player pool is rate-limited (~1.5s/request), so this runs far
    # less often than the daily FPL data ingest.
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

jobs:
  ingest-injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run FPL data ingest (players must exist before injury lookup)
        run: uv run fplquant-ingest

      - name: Run injury history ingest
        run: uv run fplquant-ingest-injuries

      # This workflow reported success every week for a month while producing
      # an empty table, because nothing ever asked whether it had. A scrape
      # that resolves nobody is a failure however cleanly the process exits,
      # and it needs to say so — the whole reason the injury layer sat inert
      # unnoticed is that the job monitoring it was green.
      - name: Check the scrape actually produced something
        run: |
          uv run python -c "
          from fplquant.models.base import session_scope
          from fplquant.models.orm import InjuryRecord, Player
          with session_scope() as s:
              total = s.query(InjuryRecord).count()
              matched = s.query(Player).filter_by(transfermarkt_lookup_status='matched').count()
              unresolved = s.query(Player).filter_by(transfermarkt_lookup_status='unresolved').count()
              print(f'injury_records={total} matched={matched} unresolved={unresolved}')
              assert total > 0, (
                  f'no injury records. matched={matched} unresolved={unresolved}. '
                  'A high unresolved count means Transfermarkt returned nothing for this '
                  'host: it blocks datacentre IPs, and GitHub-hosted runners are one. '
                  'The scrape has to run from a residential connection.'
              )
          "

      - name: Upload database snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fplquant-db-injuries-${{ github.run_id }}
          path: data/fplquant.db
          retention-days: 90
