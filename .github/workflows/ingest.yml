name: Scheduled data ingest

on:
  schedule:
    # 03:00 UTC daily — after FPL's overnight price/ownership update.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run ingest
        run: uv run fplquant-ingest

      - name: Upload database snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fplquant-db-${{ github.run_id }}
          path: data/fplquant.db
          retention-days: 90
