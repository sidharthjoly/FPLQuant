name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Cloudflare in front of the custom domain caches CSS/JS and tells
      # browsers to keep them for 4 hours, while index.html is not cached.
      # Without this a deploy serves the new page with the old stylesheet and
      # scripts. Every asset link and module import carries
      # ?v=__ASSET_VERSION__; stamping the commit here gives each deploy URLs
      # no cache has seen. Every reference to a module must carry the same
      # token, or the browser loads it twice and module state splits.
      - name: Version asset URLs
        run: sed -i "s/__ASSET_VERSION__/${GITHUB_SHA::7}/g" frontend/index.html frontend/*.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v5
