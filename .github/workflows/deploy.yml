name: Deploy backend

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd FPLQuant
            # Mirror the remote rather than merging into whatever is on the box.
            # `git pull` fails outright if the checkout has drifted at all — a
            # half-applied earlier pull, a file the deploy user cannot write —
            # and a deploy target has no business holding local changes anyway.
            # `git clean -fd` leaves ignored files alone, so the SQLite database
            # under data/ and the .env survive.
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            docker compose pull api
            docker compose up -d
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "API is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "API did not become healthy within 60s" >&2
            docker compose logs --tail=50 api
            exit 1
