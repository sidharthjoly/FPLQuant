[project]
name = "fplquant"
version = "0.1.0"
description = "Fantasy Premier League analytics and squad optimization platform"
readme = "README.md"
authors = [
    { name = "Sidharth Joly", email = "sidharthjoly@mail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "lxml>=6.1.1",
    "numpy>=2.5.2",
    "pulp>=3.3.2",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
fplquant-ingest = "fplquant.data.ingest:main"
fplquant-form = "fplquant.form.cli:main"
fplquant-optimize = "fplquant.optimizer.cli:main"
fplquant-ingest-injuries = "fplquant.data.ingest_injuries:main"
fplquant-risk = "fplquant.risk.cli:main"
fplquant-lineup = "fplquant.lineup.cli:main"
fplquant-market = "fplquant.market.cli:main"
fplquant-similar = "fplquant.similarity.cli:main"
fplquant-projection = "fplquant.similarity.projection_cli:main"
fplquant-api = "fplquant.api.run:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "fakeredis>=2.37.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.33.0.20260712",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection requires calling Depends() in argument
# defaults — this is the framework's intended idiom, not the footgun B008
# warns about elsewhere.
"src/fplquant/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pulp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fplquant --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:pulp",
]

[tool.coverage.run]
source = ["src/fplquant"]
